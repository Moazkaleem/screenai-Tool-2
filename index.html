<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ScreenAI — AI Resume Screener</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #080c14;
  --bg2:     #0d1220;
  --bg3:     #111827;
  --blue:    #3b82f6;
  --blue-d:  #1d4ed8;
  --purple:  #8b5cf6;
  --purple-d:#6d28d9;
  --purple-l:#a78bfa;
  --gold:    #f59e0b;
  --green:   #10b981;
  --coral:   #f43f5e;
  --text:    #f1f5f9;
  --muted:   #64748b;
  --muted2:  #94a3b8;
  --border:  rgba(255,255,255,0.07);
  --sans:    'Inter', sans-serif;
}
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

nav {
  background: rgba(8,12,20,0.95); border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 58px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px);
}
.nav-brand { display: flex; align-items: center; gap: 9px; }
.nav-icon { width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
.nav-icon.starter { background: var(--blue); }
.nav-icon.pro { background: linear-gradient(135deg, var(--purple), var(--purple-d)); box-shadow: 0 0 14px rgba(139,92,246,0.4); }
.nav-name { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
.nav-badge-starter { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); color: #93c5fd; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 10px; }
.nav-badge-pro { background: linear-gradient(135deg, var(--gold), #d97706); color: #1c0a00; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 10px; letter-spacing: 1px; }
.nav-right { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.nav-unlimited { background: rgba(139,92,246,0.1); border: 1px solid rgba(139,92,246,0.25); color: var(--purple-l); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 8px; }

.main { max-width: 960px; margin: 0 auto; padding: 32px 20px 60px; }

.tool-header { text-align: center; margin-bottom: 28px; }
.pro-header-badge { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.25); padding: 5px 14px; border-radius: 20px; }
.pro-header-badge span { font-size: 12px; font-weight: 600; color: #fcd34d; }
.tool-header h1 { font-size: clamp(22px,4vw,34px); font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; }
.tool-header h1 .blue { color: var(--blue); }
.tool-header h1 .purple { color: var(--purple-l); }
.tool-header p { font-size: 14px; color: var(--muted2); max-width: 440px; margin: 0 auto; line-height: 1.6; }

.pro-strip { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 24px; }
.pro-feature { display: flex; align-items: center; gap: 6px; background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.2); padding: 4px 10px; border-radius: 8px; font-size: 11px; color: var(--purple-l); font-weight: 500; }

.error-box { background: rgba(244,63,94,0.08); border: 1px solid rgba(244,63,94,0.25); border-radius: 10px; padding: 12px 16px; color: #fda4af; font-size: 13px; margin-bottom: 14px; display: none; }
.error-box.show { display: block; }

.input-row { display: flex; gap: 14px; margin-bottom: 14px; }
@media(max-width:600px){ .input-row { flex-direction: column; } }
.input-box { flex: 1; display: flex; flex-direction: column; }
.input-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.input-box textarea {
  flex: 1; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; color: var(--text); font-family: var(--sans);
  font-size: 13px; line-height: 1.7; outline: none; resize: vertical; min-height: 260px; transition: border-color 0.2s;
}
.input-box textarea:focus { border-color: rgba(59,130,246,0.5); }
.input-box textarea.pro:focus { border-color: rgba(139,92,246,0.5); }
.input-box textarea::placeholder { color: var(--muted); }

.analyze-btn {
  width: 100%; padding: 15px; border-radius: 12px; border: none; cursor: pointer;
  color: #fff; font-size: 15px; font-weight: 700; font-family: var(--sans);
  letter-spacing: 0.3px; transition: all 0.25s;
}
.analyze-btn.starter { background: linear-gradient(135deg, var(--blue), var(--blue-d)); box-shadow: 0 4px 20px rgba(59,130,246,0.3); }
.analyze-btn.pro { background: linear-gradient(135deg, var(--purple), var(--purple-d)); box-shadow: 0 4px 20px rgba(139,92,246,0.35); }
.analyze-btn:hover:not(:disabled) { transform: translateY(-2px); }
.analyze-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.progress-wrap { margin-top: 14px; display: none; }
.progress-wrap.show { display: block; }
.progress-bar-bg { background: rgba(255,255,255,0.06); border-radius: 8px; height: 6px; overflow: hidden; margin-bottom: 10px; }
.progress-bar-fill { height: 100%; border-radius: 8px; transition: width 0.4s ease; width: 0%; }
.progress-bar-fill.starter { background: linear-gradient(90deg, var(--blue), var(--green)); }
.progress-bar-fill.pro { background: linear-gradient(90deg, var(--purple), var(--gold)); }
.progress-steps { display: flex; gap: 8px; flex-wrap: wrap; }
.progress-step { font-size: 11px; padding: 4px 10px; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--muted); transition: all 0.3s; }
.progress-step.done.starter { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: var(--green); }
.progress-step.done.pro { background: rgba(139,92,246,0.12); border-color: rgba(139,92,246,0.3); color: var(--purple-l); }

.result-wrap { margin-top: 24px; display: none; }
.result-wrap.show { display: block; }

.score-card { background: var(--bg2); border-radius: 16px; padding: 24px; border: 1px solid var(--border); margin-bottom: 14px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.score-card.pro { border-color: rgba(139,92,246,0.2); background: linear-gradient(135deg, rgba(139,92,246,0.06), var(--bg2)); }
.score-info { flex: 1; }
.score-verdict { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 10px; font-size: 17px; font-weight: 800; margin-bottom: 10px; }
.score-summary { font-size: 13px; color: var(--muted2); line-height: 1.65; max-width: 420px; }
.score-meta { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
.score-meta-item { text-align: center; }
.score-meta-val { font-size: 22px; font-weight: 800; line-height: 1; }
.score-meta-lbl { font-size: 10px; color: var(--muted); margin-top: 3px; letter-spacing: 0.5px; }

.two-col { display: flex; gap: 12px; margin-bottom: 12px; }
@media(max-width:560px){ .two-col { flex-direction: column; } }
.result-box { flex: 1; background: var(--bg2); border-radius: 12px; padding: 18px; border: 1px solid var(--border); }
.result-box-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
.tag-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.tag-green { background: rgba(16,185,129,0.1); color: var(--green); border: 1px solid rgba(16,185,129,0.2); }
.tag-red { background: rgba(244,63,94,0.1); color: var(--coral); border: 1px solid rgba(244,63,94,0.2); }

.list-box { background: var(--bg2); border-radius: 12px; padding: 18px; border: 1px solid var(--border); margin-bottom: 12px; }
.list-box-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
.list-items { display: flex; flex-direction: column; gap: 9px; }
.list-item { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; color: var(--muted2); line-height: 1.6; }
.list-bullet { flex-shrink: 0; margin-top: 2px; font-weight: 700; }

.culture-box { border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; display: flex; gap: 12px; align-items: flex-start; }
.culture-box.starter { background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.15); }
.culture-box.pro { background: rgba(139,92,246,0.06); border: 1px solid rgba(139,92,246,0.2); }
.culture-icon { font-size: 18px; flex-shrink: 0; }
.culture-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.pro-tag { background: linear-gradient(135deg, var(--gold), #d97706); color: #1c0a00; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
.culture-box p { font-size: 13px; color: var(--muted2); line-height: 1.65; }

.interview-box { background: rgba(245,158,11,0.05); border: 1px solid rgba(245,158,11,0.2); border-radius: 12px; padding: 18px; margin-bottom: 12px; }
.interview-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #fcd34d; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.interview-questions { display: flex; flex-direction: column; gap: 9px; }
.interview-q { background: rgba(245,158,11,0.06); border: 1px solid rgba(245,158,11,0.12); border-radius: 8px; padding: 11px 14px; font-size: 13px; color: var(--muted2); line-height: 1.6; display: flex; gap: 9px; }
.q-num { color: var(--gold); font-weight: 700; flex-shrink: 0; }

.action-row { display: flex; gap: 12px; flex-wrap: wrap; }
.btn-new { flex: 1; padding: 13px; border-radius: 10px; border: none; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--sans); transition: all 0.2s; }
.btn-new.starter { background: linear-gradient(135deg, var(--blue), var(--blue-d)); }
.btn-new.pro { background: linear-gradient(135deg, var(--purple), var(--purple-d)); }
.btn-new:hover { transform: translateY(-1px); }
.btn-copy { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg2); color: var(--muted2); font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--sans); transition: all 0.2s; }
.btn-copy:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }

.ring-svg { transform: rotate(-90deg); }
.ring-track { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 10; }
.ring-fill { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dasharray 1.2s ease; }
</style>
</head>
<body>

<nav id="navbar">
  <div class="nav-brand">
    <div class="nav-icon" id="navIcon">🎯</div>
    <span class="nav-name">ScreenAI</span>
    <span id="navBadge"></span>
  </div>
  <div class="nav-right" id="navRight">⚡ Powered by Claude AI</div>
</nav>

<div class="main">
  <div class="tool-header" id="toolHeader"></div>
  <div id="proStrip"></div>
  <div class="error-box" id="errorBox"></div>
  <div class="input-row">
    <div class="input-box">
      <div class="input-label">📋 Job Description</div>
      <textarea id="jobDesc" placeholder="Paste the full job description here...&#10;&#10;Include: job title, responsibilities, required skills, experience level."></textarea>
    </div>
    <div class="input-box">
      <div class="input-label">📄 Candidate Resume</div>
      <textarea id="resumeText" placeholder="Paste the candidate's resume here...&#10;&#10;Include: work experience, education, skills, certifications."></textarea>
    </div>
  </div>
  <button class="analyze-btn" id="analyzeBtn" onclick="analyze()"></button>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-steps">
      <div class="progress-step" id="step1">Parsing resume...</div>
      <div class="progress-step" id="step2">Matching skills...</div>
      <div class="progress-step" id="step3">Scoring experience...</div>
      <div class="progress-step" id="step4">Generating report...</div>
    </div>
  </div>
  <div class="result-wrap" id="resultWrap"></div>
</div>

<script>
let lastResult = null;
const isPro = new URLSearchParams(window.location.search).get('pro') === 'true';

// Setup UI based on plan
window.addEventListener('load', () => {
  const navIcon   = document.getElementById('navIcon');
  const navBadge  = document.getElementById('navBadge');
  const navRight  = document.getElementById('navRight');
  const header    = document.getElementById('toolHeader');
  const proStrip  = document.getElementById('proStrip');
  const btn       = document.getElementById('analyzeBtn');
  const fill      = document.getElementById('progressFill');
  const jobTa     = document.getElementById('jobDesc');
  const resTa     = document.getElementById('resumeText');

  if (isPro) {
    document.title = 'ScreenAI Pro — AI Resume Screener';
    navIcon.className = 'nav-icon pro';
    navBadge.className = 'nav-badge-pro';
    navBadge.textContent = 'PRO';
    navRight.innerHTML = '<span class="nav-unlimited">∞ Unlimited</span> ⚡ Claude AI';
    btn.className = 'analyze-btn pro';
    btn.textContent = '🚀 Screen This Candidate — PRO Analysis';
    fill.className = 'progress-bar-fill pro';
    jobTa.classList.add('pro');
    resTa.classList.add('pro');
    document.querySelectorAll('.progress-step').forEach(s => s.dataset.plan = 'pro');
    header.innerHTML = `
      <div class="pro-header-badge"><span>👑 PRO PLAN — ALL FEATURES UNLOCKED</span></div>
      <h1>AI Resume <span class="purple">Screener Pro</span></h1>
      <p>Unlimited screens with full insights — culture fit and tailored interview questions included.</p>`;
    proStrip.innerHTML = `<div class="pro-strip">
      <div class="pro-feature">🎯 AI Score</div>
      <div class="pro-feature">✅ Hire Verdict</div>
      <div class="pro-feature">🔬 Skills Gap</div>
      <div class="pro-feature">💪 Strengths</div>
      <div class="pro-feature">🤝 Culture Fit</div>
      <div class="pro-feature">❓ Interview Qs</div>
      <div class="pro-feature">∞ Unlimited</div>
    </div>`;
  } else {
    navIcon.className = 'nav-icon starter';
    navBadge.className = 'nav-badge-starter';
    navBadge.textContent = 'STARTER';
    btn.className = 'analyze-btn starter';
    btn.textContent = '🎯 Screen This Candidate';
    fill.className = 'progress-bar-fill starter';
    header.innerHTML = `
      <h1>AI Resume <span class="blue">Screener</span></h1>
      <p>Paste a job description and resume — get a full screening report in under 10 seconds.</p>`;
  }
});

async function analyze() {
  const jobDesc    = document.getElementById('jobDesc').value.trim();
  const resumeText = document.getElementById('resumeText').value.trim();
  const errorBox   = document.getElementById('errorBox');
  const analyzeBtn = document.getElementById('analyzeBtn');

  if (!jobDesc || !resumeText) {
    errorBox.textContent = '⚠️ Please fill in both the job description and the resume.';
    errorBox.classList.add('show');
    return;
  }

  errorBox.classList.remove('show');
  analyzeBtn.disabled = true;
  analyzeBtn.textContent = isPro ? '🤖 Running PRO Analysis...' : '🤖 Analyzing...';
  document.getElementById('progressWrap').classList.add('show');
  document.getElementById('resultWrap').classList.remove('show');

  let pct = 0;
  const steps = ['step1','step2','step3','step4'];
  const fill  = document.getElementById('progressFill');
  const timer = setInterval(() => {
    pct = Math.min(pct + Math.random() * 10, 88);
    fill.style.width = pct + '%';
    const idx = Math.floor(pct / 25);
    steps.forEach((s, i) => {
      const el = document.getElementById(s);
      if (i < idx) { el.classList.add('done'); el.classList.add(isPro ? 'pro' : 'starter'); }
    });
  }, 400);

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);

    const res = await fetch('https://screenai-backend.onrender.com/screen', {
      signal: controller.signal,
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jobDesc, resumeText, pro: isPro })
    });

    clearTimeout(timeout);
    const parsed = await res.json();
    clearInterval(timer);
    fill.style.width = '100%';
    steps.forEach(s => {
      const el = document.getElementById(s);
      el.classList.add('done');
      el.classList.add(isPro ? 'pro' : 'starter');
    });

    if (parsed.error) throw new Error(parsed.error);
    lastResult = parsed;

    setTimeout(() => {
      document.getElementById('progressWrap').classList.remove('show');
      showResult(parsed);
      analyzeBtn.disabled = false;
      analyzeBtn.textContent = isPro ? '🚀 Screen This Candidate — PRO Analysis' : '🎯 Screen This Candidate';
    }, 500);

  } catch(e) {
    clearInterval(timer);
    document.getElementById('progressWrap').classList.remove('show');
    errorBox.textContent = '⚠️ Error: ' + e.message;
    errorBox.classList.add('show');
    analyzeBtn.disabled = false;
    analyzeBtn.textContent = isPro ? '🚀 Screen This Candidate — PRO Analysis' : '🎯 Screen This Candidate';
  }
}

function showResult(r) {
  const vc = {
    'STRONG HIRE': { color:'#10b981', bg:'rgba(16,185,129,0.12)', border:'rgba(16,185,129,0.25)', icon:'🚀' },
    'HIRE':        { color:'#10b981', bg:'rgba(16,185,129,0.10)', border:'rgba(16,185,129,0.2)',  icon:'✅' },
    'MAYBE':       { color:'#f59e0b', bg:'rgba(245,158,11,0.12)', border:'rgba(245,158,11,0.25)', icon:'🤔' },
    'PASS':        { color:'#f43f5e', bg:'rgba(244,63,94,0.12)',  border:'rgba(244,63,94,0.25)',  icon:'❌' },
  }[r.verdict] || { color:'#f59e0b', bg:'rgba(245,158,11,0.12)', border:'rgba(245,158,11,0.25)', icon:'🤔' };

  const sc   = r.score >= 75 ? '#10b981' : r.score >= 50 ? '#f59e0b' : '#f43f5e';
  const circ = 2 * Math.PI * 54;
  const dash = (r.score / 100) * circ;
  const ec   = { Strong:'#10b981', Good:'#10b981', Partial:'#f59e0b', Weak:'#f43f5e' }[r.experience_fit] || '#f59e0b';
  const planClass = isPro ? 'pro' : 'starter';
  const accentColor = isPro ? '#8b5cf6' : '#3b82f6';

  let html = `
    <div class="score-card ${planClass}">
      <div>
        <svg width="120" height="120" viewBox="0 0 130 130" class="ring-svg">
          <circle class="ring-track" cx="65" cy="65" r="54"/>
          <circle class="ring-fill" cx="65" cy="65" r="54" stroke="${sc}" stroke-dasharray="${dash} ${circ}"/>
          <text x="65" y="60" text-anchor="middle" fill="${sc}"
            style="font-size:30px;font-weight:900;font-family:Inter,sans-serif;transform:rotate(90deg);transform-origin:65px 65px">${r.score}</text>
          <text x="65" y="78" text-anchor="middle" fill="rgba(255,255,255,0.35)"
            style="font-size:11px;font-family:Inter,sans-serif;transform:rotate(90deg);transform-origin:65px 65px">/ 100</text>
        </svg>
      </div>
      <div class="score-info">
        <div class="score-verdict" style="background:${vc.bg};border:1px solid ${vc.border};color:${vc.color}">${vc.icon} ${r.verdict}</div>
        <p class="score-summary">${r.summary}</p>
        <div class="score-meta">
          <div class="score-meta-item"><div class="score-meta-val" style="color:${accentColor}">${r.match_pct}%</div><div class="score-meta-lbl">JOB MATCH</div></div>
          <div class="score-meta-item"><div class="score-meta-val" style="color:${ec}">${r.experience_fit}</div><div class="score-meta-lbl">EXP. FIT</div></div>
        </div>
      </div>
    </div>

    <div class="two-col">
      <div class="result-box">
        <div class="result-box-label" style="color:#10b981">✅ Skills Matched</div>
        <div class="tag-wrap">${(r.top_skills_matched||[]).map(s=>`<span class="tag tag-green">${s}</span>`).join('')}</div>
      </div>
      <div class="result-box">
        <div class="result-box-label" style="color:#f43f5e">❌ Skills Missing</div>
        <div class="tag-wrap">${(r.missing_skills||[]).length>0?(r.missing_skills).map(s=>`<span class="tag tag-red">${s}</span>`).join(''):'<span style="font-size:13px;color:#64748b">No critical gaps</span>'}</div>
      </div>
    </div>

    <div class="two-col">
      <div class="list-box">
        <div class="list-box-label" style="color:#f59e0b">💪 Strengths</div>
        <div class="list-items">${(r.strengths||[]).map(s=>`<div class="list-item"><span class="list-bullet" style="color:#10b981">✓</span>${s}</div>`).join('')}</div>
      </div>
      <div class="list-box">
        <div class="list-box-label" style="color:#f43f5e">⚠️ Concerns</div>
        <div class="list-items">${(r.gaps||[]).map(g=>`<div class="list-item"><span class="list-bullet" style="color:#f43f5e">!</span>${g}</div>`).join('')}</div>
      </div>
    </div>

    <div class="culture-box ${planClass}">
      <div class="culture-icon">🤝</div>
      <div>
        <div class="culture-label" style="color:${accentColor}">
          Culture & Personality Fit
          ${isPro ? '<span class="pro-tag">PRO</span>' : ''}
        </div>
        <p>${r.culture_note}</p>
      </div>
    </div>`;

  if (isPro && r.interview_questions && r.interview_questions.length > 0) {
    html += `
    <div class="interview-box">
      <div class="interview-label">❓ Suggested Interview Questions <span class="pro-tag">PRO</span></div>
      <div class="interview-questions">
        ${r.interview_questions.map((q,i)=>`<div class="interview-q"><span class="q-num">Q${i+1}</span><span>${q}</span></div>`).join('')}
      </div>
    </div>`;
  }

  html += `
    <div class="action-row">
      <button class="btn-new ${planClass}" onclick="resetTool()">+ Screen Another</button>
      <button class="btn-copy" onclick="copyReport()">📋 Copy Report</button>
    </div>`;

  const wrap = document.getElementById('resultWrap');
  wrap.innerHTML = html;
  wrap.classList.add('show');
  wrap.scrollIntoView({ behavior:'smooth', block:'start' });
}

function resetTool() {
  document.getElementById('jobDesc').value    = '';
  document.getElementById('resumeText').value = '';
  document.getElementById('resultWrap').classList.remove('show');
  document.getElementById('progressWrap').classList.remove('show');
  document.getElementById('errorBox').classList.remove('show');
  document.getElementById('progressFill').style.width = '0%';
  document.querySelectorAll('.progress-step').forEach(s => {
    s.classList.remove('done','starter','pro');
  });
  window.scrollTo({ top:0, behavior:'smooth' });
}

function copyReport() {
  if (!lastResult) return;
  const r = lastResult;
  let txt = `SCREENAI${isPro?' PRO':''} — RESUME SCREENING REPORT
${'─'.repeat(40)}
Score:          ${r.score}/100
Verdict:        ${r.verdict}
Job Match:      ${r.match_pct}%
Experience Fit: ${r.experience_fit}

SUMMARY
${r.summary}

STRENGTHS
${(r.strengths||[]).map(s=>'• '+s).join('\n')}

CONCERNS
${(r.gaps||[]).map(g=>'• '+g).join('\n')}

SKILLS MATCHED: ${(r.top_skills_matched||[]).join(', ')}
SKILLS MISSING: ${(r.missing_skills||[]).join(', ')||'None'}

CULTURE FIT
${r.culture_note}`;

  if (isPro && r.interview_questions) {
    txt += `\n\nINTERVIEW QUESTIONS\n${r.interview_questions.map((q,i)=>`Q${i+1}. ${q}`).join('\n')}`;
  }

  txt += `\n${'─'.repeat(40)}\nPowered by ScreenAI`;

  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '✅ Copied!';
    btn.style.color = '#10b981';
    setTimeout(() => { btn.textContent = '📋 Copy Report'; btn.style.color = ''; }, 2000);
  });
}
</script>
</body>
</html>
